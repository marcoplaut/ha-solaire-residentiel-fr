name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post your customer area email, password or tokens.** Review logs and files before attaching them.
        The diagnostics file is redacted, but check it anyway.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Shown in HACS, or `version` in manifest.json.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Drag and drop the diagnostics file here (Settings > Devices & services > Solaire Résidentiel FR > the
        three-dot menu > Download diagnostics).
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Enable debug logging for `custom_components.edf_enr` (see the README), reproduce the problem, then
        paste the relevant lines.
      render: text
