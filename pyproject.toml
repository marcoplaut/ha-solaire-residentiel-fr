[project]
name = "ha-solaire-residentiel-fr"
version = "0.1.0"
description = "Home Assistant integration for French residential solar installations"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["tools", "docs"]

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "F", "FLY", "G", "I", "ICN",
  "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "RET", "RSE",
  "RUF", "S", "SIM", "SLF", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = [
  "D202",    # No blank lines allowed after function docstring (conflicts with formatter)
  "D203",    # 1 blank line required before class docstring (incompatible with D211)
  "D213",    # Multi-line docstring summary should start at the second line
  "E501",    # Line too long (handled by the formatter)
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments
  "PLR0915", # Too many statements
  "PLR2004", # Magic value used in comparison
  "TRY003",  # Long messages outside the exception class
  "ISC001",  # Conflicts with the formatter
  "TC001",   # Runtime imports of typing-only names are fine (Home Assistant style)
  "TC002",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104", "PLR0917", "S101", "S105", "S106", "SLF001", "PLC0415", "INP001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
split-on-trailing-comma = false
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant", "pytest_homeassistant_custom_component"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: contract tests against the real customer portal (need credentials)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["custom_components/edf_enr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true
packages = ["custom_components.edf_enr"]
